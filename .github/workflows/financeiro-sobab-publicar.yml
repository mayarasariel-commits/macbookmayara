# Publica o Financeiro SOBAB no GitHub Pages sempre que a versão principal (main) muda.
name: Publicar Financeiro SOBAB

on:
  push:
    branches: [main]
    paths: ["sobab-financeiro/site/**", ".github/workflows/financeiro-sobab-publicar.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sobab-financeiro/site
      - id: deploy
        uses: actions/deploy-pages@v4
