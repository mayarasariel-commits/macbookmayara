# Publicação do Financeiro SOBAB no Netlify (plano gratuito).
# O Netlify lê este arquivo sozinho: não precisa preencher nada na tela de configuração.
[build]
  base = "sobab-financeiro/site"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex, nofollow"

# Sempre busca a versão mais nova dos arquivos do sistema
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
